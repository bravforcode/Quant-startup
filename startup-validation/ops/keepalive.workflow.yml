# Belongs at .github/workflows/keepalive.yml. Move it there only when a Supabase project exists.
# Needs repo secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions).
# Note (playbook C.4): GitHub can auto-disable scheduled workflows when the repo has no activity.
name: keepalive
on:
  schedule: [{ cron: "0 3 */3 * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -fsS "$SUPABASE_URL/rest/v1/keepalive?select=id&limit=1"
          -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
